services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jay
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ai_support_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jay -d ai_support_lab"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jay:devpassword@db:5432/ai_support_lab
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
